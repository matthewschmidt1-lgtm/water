<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WATER — it is always going somewhere</title>
  <meta name="description" content="Follow one drop of water through clouds, rain, mountains, soil, trees, a glass, and the ocean. An interactive journey of water for every age.">
  <meta name="theme-color" content="#04111f">
  <meta property="og:title" content="WATER">
  <meta property="og:description" content="It is always going somewhere. An interactive journey through the water cycle, for kids and grandparents alike.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://water-production-6a37.up.railway.app/">
  <meta property="og:image" content="https://water-production-6a37.up.railway.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A single glowing water drop hanging above a tide under a starry sky, with the word WATER.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="WATER">
  <meta name="twitter:description" content="It is always going somewhere.">
  <meta name="twitter:image" content="https://water-production-6a37.up.railway.app/og-image.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3c5 8 10 12 10 18a10 10 0 0 1-20 0c0-6 5-10 10-18z' fill='%237ff2ff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/water.css">
</head>
<body>

  <nav id="drop-nav" aria-label="Chapters">
    <button class="drop" aria-label="Open chapters" aria-expanded="false"></button>
    <ul class="drop-list"></ul>
  </nav>

  <div class="top-right">
    <button id="sound-toggle" class="ghost" aria-pressed="false"><span>sound off</span> ♫</button>
  </div>

  <header class="hero" id="top">
    <canvas class="hero-canvas" id="hero-canvas"></canvas>
    <div class="hero-copy">
      <h1>WATER</h1>
      <p>It is always going somewhere.</p>
      <div class="breath-hint"><span id="breath-word">inhale</span></div>
    </div>
    <div class="scroll-cue">follow it ↓</div>
  </header>

  <main>
    <section class="chapter" id="cloud" data-chapter="cloud" data-label="Sky"></section>
    <section class="chapter" id="rain" data-chapter="rain" data-label="Rain"></section>
    <section class="chapter" id="mountain" data-chapter="mountain" data-label="Mountain"></section>
    <section class="chapter" id="soil" data-chapter="soil" data-label="Soil"></section>
    <section class="chapter" id="tree" data-chapter="tree" data-label="Tree"></section>
    <section class="chapter" id="cup" data-chapter="cup" data-label="Cup"></section>
    <section class="chapter" id="ocean" data-chapter="ocean" data-label="Ocean"></section>
    <section class="chapter" id="lab" data-chapter="lab" data-label="Lab"></section>
    <section class="chapter" id="you" data-chapter="you" data-label="You"></section>
  </main>

  <footer>
    <p class="motto">Water changes.<br>Water connects.<br>Water returns.</p>
  </footer>

  <div class="bottom-bar">
    <button id="where-btn" class="btn">Where is water?</button>
    <button id="follow-btn" class="btn">Follow the water</button>
  </div>

  <div id="where-card" class="card" hidden>
    <p class="kicker">Right now</p>
    <p class="where-text"></p>
    <p class="where-note"></p>
    <div class="row">
      <button class="ghost where-close">close</button>
      <button class="btn where-next">next</button>
    </div>
  </div>

  <div id="follow" hidden>
    <div class="follow-count"></div>
    <p class="follow-word"></p>
    <p class="follow-step"></p>
    <div class="row">
      <button class="ghost follow-close">stop</button>
      <button class="btn follow-next">next ↓</button>
    </div>
  </div>

  <script type="module" src="js/hero.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
