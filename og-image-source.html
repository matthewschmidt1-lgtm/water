<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WATER og image</title>
<style>
  html, body { margin: 0; background: #04111f; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<script>
// Static render of the hero at its best moment: stars out, the drop hanging, the tide mid-inhale.
const c = document.getElementById('c').getContext('2d');
const W = 1200, H = 630;
let seed = 42;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// sky
const sky = c.createRadialGradient(W / 2, H * 0.62, 20, W / 2, H * 0.62, W * 0.7);
sky.addColorStop(0, '#0a2a46'); sky.addColorStop(0.65, '#04111f'); sky.addColorStop(1, '#04111f');
c.fillStyle = sky; c.fillRect(0, 0, W, H);

// stars
for (let i = 0; i < 170; i++) {
  const x = rnd() * W, y = rnd() * rnd() * H * 0.5, r = 0.5 + rnd() * 1.3, a = 0.25 + rnd() * 0.65;
  c.fillStyle = `rgba(223,251,255,${a * (1 - y / (H * 0.6))})`;
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
  if (rnd() < 0.08) {
    const L = 5 + rnd() * 5;
    c.strokeStyle = `rgba(223,251,255,${a * 0.5})`; c.lineWidth = 0.8;
    c.beginPath(); c.moveTo(x - L, y); c.lineTo(x + L, y); c.moveTo(x, y - L); c.lineTo(x, y + L); c.stroke();
  }
}

// title
c.textAlign = 'center';
c.fillStyle = '#f4f9fb';
c.font = '400 118px "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif';
const title = 'W A T E R';
c.fillText(title, W / 2 + 10, 285);
c.fillStyle = 'rgba(244,249,251,0.66)';
c.font = 'italic 30px "Iowan Old Style", "Palatino Linotype", Georgia, serif';
c.fillText('It is always going somewhere.', W / 2, 335);

// the water: mid-inhale, surface a little high
const level = H * 0.66;
const g = c.createLinearGradient(0, level - 10, 0, H);
g.addColorStop(0, 'rgba(47,184,198,0.45)');
g.addColorStop(0.35, 'rgba(11,51,82,0.85)');
g.addColorStop(1, 'rgba(4,17,31,1)');
c.fillStyle = g;
c.beginPath(); c.moveTo(0, H);
const surf = (x) => level + Math.sin(x * 0.012 + 1.2) * 4 + Math.sin(x * 0.03 - 0.4) * 2;
for (let x = 0; x <= W; x += 6) c.lineTo(x, surf(x));
c.lineTo(W, H); c.closePath(); c.fill();
c.strokeStyle = 'rgba(127,242,255,0.38)'; c.lineWidth = 1.5;
c.beginPath(); for (let x = 0; x <= W; x += 6) x === 0 ? c.moveTo(x, surf(x)) : c.lineTo(x, surf(x)); c.stroke();

// ripples from the last drop
[[70, 0.55], [130, 0.35], [200, 0.18]].forEach(([R, a]) => {
  c.strokeStyle = `rgba(127,242,255,${a})`; c.lineWidth = 1.5;
  c.beginPath(); c.ellipse(W / 2, surf(W / 2), R, R * 0.22, 0, 0, Math.PI * 2); c.stroke();
});

// the drop, hanging above the surface with a glow
function drop(x, y, r) {
  c.save();
  c.shadowColor = 'rgba(127,242,255,0.7)'; c.shadowBlur = 40;
  c.beginPath();
  c.moveTo(x, y - r * 1.8);
  c.bezierCurveTo(x + r * 1.2, y - r * 0.2, x + r, y + r, x, y + r);
  c.bezierCurveTo(x - r, y + r, x - r * 1.2, y - r * 0.2, x, y - r * 1.8);
  const dg = c.createRadialGradient(x - r * 0.3, y - r * 0.3, 0, x, y, r * 1.6);
  dg.addColorStop(0, '#dffbff'); dg.addColorStop(0.5, '#7ff2ff'); dg.addColorStop(1, '#2fb8c6');
  c.fillStyle = dg; c.fill();
  c.restore();
}
drop(W / 2, 150, 22);
</script>
</body>
</html>
